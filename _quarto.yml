project:
  type: website
  output-dir: _site
  # Regenerates the publication lists from publications.bib on every render,
  # so `quarto render` and `quarto preview` are always in sync with the .bib.
  pre-render: scripts/build_publications.py

website:
  title: "Massimo Anelli"
  # `quarto publish gh-pages` writes the Pages CNAME file from this value.
  site-url: "https://www.massimoanelli.com"
  description: "Associate Professor of Economics, Bocconi University"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: media.qmd
        text: "Policy & Media"
      - href: teaching.qmd
        text: Teaching
      - href: ai-society.qmd
        text: "AI & Society"
      - href: cv.qmd
        text: CV
    right:
      - icon: envelope
        href: mailto:massimo.anelli@unibocconi.it
        aria-label: Email
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=4CWV7jsAAAAJ
        aria-label: Google Scholar
  page-footer:
    center: "© Massimo Anelli · Department of Social and Political Sciences, Bocconi University"

format:
  html:
    theme: [cosmo, styles.scss]
    # Full-width layout; styles.scss caps the content at a readable max width.
    page-layout: full
    toc: false
    anchor-sections: false
    link-external-newwindow: true
